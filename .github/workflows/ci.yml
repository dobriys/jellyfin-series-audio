name: Build Jellyfin catalog package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Jellyfin.Plugin.SeriesAudio -c Release
      - run: python3 .github/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SeriesAudio-jellyfin-12.4
          if-no-files-found: error
          path: |
            artifacts/*.zip
            artifacts/manifest.json
