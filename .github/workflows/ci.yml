name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: dotnet test tests/SeriesAudio.Tests -c Release
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Fetch pinned Jellyfin source for integration tests
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin
          ref: v12.4
          path: .local/jellyfin
      - run: dotnet build .local/jellyfin/Jellyfin.Server/Jellyfin.Server.csproj -c Release -p:RunAnalyzers=false
      - name: Install test media generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - run: python3 scripts/smoke-test.py --server .local/jellyfin/Jellyfin.Server/bin/Release/net10.0/jellyfin.dll
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SeriesAudio-jellyfin-12.4
          path: artifacts/*.zip
